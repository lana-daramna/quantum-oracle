<use href="#gemShape"/>
<g clip-path="url(#gemClip)"><circle cx="200" cy="250" r="110" fill="url(#core)" opacity=".8"/><rect class="shine" x="0" y="0" width="46" height="520" fill="rgba(255,255,255,.55)" transform="skewX(-18)"/></g>
<g fill="#fff"><circle class="tw" cx="60" cy="90" r="3"/><circle class="tw" cx="345" cy="130" r="2.5"/><circle class="tw" cx="40" cy="330" r="2"/><circle class="tw" cx="360" cy="360" r="3"/><circle class="tw" cx="310" cy="40" r="2"/><circle class="tw" cx="100" cy="440" r="2.5"/></g></svg>`;

const cv=$('#sky'),cx=cv.getContext('2d');let W,H,P=[];
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,v:Math.random()*.3+.05}))};rs();addEventListener('resize',rs);
(function f(){cx.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;if(p.y<0)p.y=H;cx.fillStyle=`rgba(216,180,254,${.3+p.r/3})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}requestAnimationFrame(f)})();

const data={};let timer;
function start(){clearTimeout(timer);for(const k in data)delete data[k];
 app.innerHTML=`${crystal('big')}<div class="event"><div class="uni">BIRZEIT UNIVERSITY</div><div class="fest">QISKIT FALL FEST 2026</div><div class="theme">A Decade on the Cloud</div></div><h1>${t().title}</h1><p class="sub"><b>${t().tag}</b><br>${t().sub}</p><button id="go">${t().enter}</button><p class="sub" style="font-size:.8rem">${t().note}</p>`;
 $('#go').onclick=()=>{S.enter();step1()}}
function step1(){app.innerHTML=`<h2>${t().id}</h2><div class="glass"><label for="n">${t().name}</label><input id="n" autocomplete="name" maxlength="100"><label for="e">${t().email}</label><input id="e" type="email" dir="ltr" autocomplete="email"><div class="err" id="er" role="alert"></div><button id="nx">${t().next}</button></div>`;
 $('#nx').onclick=()=>{const n=$('#n').value.trim(),e=$('#e').value.trim();if(!n)return $('#er').textContent=t().eName;if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e))return $('#er').textContent=t().eMail;Object.assign(data,{name:n,email:e});step2()};$('#n').focus()}
function step2(){app.innerHTML=`<h2>${t().seek}</h2><div class="glass"><textarea id="q" maxlength="500" dir="auto" placeholder="${t().ph}" aria-label="${t().seek}"></textarea>
<div>${t().ex.map(x=>`<button class="ghost">${esc(x)}</button>`).join('')}</div>
<label class="chk"><input type="checkbox" id="c1">${t().c1}</label><label class="chk"><input type="checkbox" id="c2">${t().c2}</label>
<div class="err" id="er" role="alert"></div><button id="act">${t().act}</button></div>`;
 app.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{$('#q').value=b.textContent});
 $('#act').onclick=()=>{const q=$('#q').value.trim();if(q.length<3)return $('#er').textContent=t().eQ;if(!$('#c1').checked)return $('#er').textContent=t().eC;Object.assign(data,{question:q,consent:true,marketingConsent:$('#c2').checked});run()};$('#q').focus()}

async function run(){
 app.innerHTML=`${crystal()}<div class="journey">${t().jn.map((j,i)=>`<span class="node" id="j${i}">${j}</span>`).join('')}</div><div class="stage" id="st" aria-live="polite"></div><div class="mono" id="ci"></div>`;
 const mark=i=>t().jn.forEach((_,k)=>{$('#j'+k).className='node'+(k<i?' done':k==i?' on':'')});
 const req=fetch('/api/oracle/consult',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)})
  .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'error');return j}).catch(e=>({__err:e.message}));
 for(const [j,s,d] of [[0,0,1400],[1,1,2200],[2,2,2000],[2,3,1600]]){mark(j);[S.seal,S.cloud,S.quantum,S.measure][s]();$('#st').textContent=t().st[s];$('#ci').textContent=s>=2?'|00⟩ ── H⊗H ── Measure':'';$('.gem').classList.add('pulse');await sleep(d);$('.gem').classList.remove('pulse')}
 mark(3);$('#st').textContent=t().st[4];const stopThink=S.think();
 const res=await req;stopThink();
 if(res.__err){app.innerHTML=`<h2>${t().lost}</h2><p class="sub">${esc(res.__err)}</p><button id="rt">${t().retry}</button>`;$('#rt').onclick=step2;return}
 if(res.sealed)return showSealed(res);
 return showAnswer(res,false);
}
const mask=e=>{const [u,d]=String(e||'').split('@');return d?u.slice(0,1)+'•••@'+d:''};
function showSealed(res){
 app.innerHTML=`${crystal('big sealed')}<h2>${t().sealedTitle}</h2><p class="sub" style="font-size:1.15rem">${t().sealedMsg}</p>
 <div class="chips"><span class="chip mono">✉ ${esc(mask(data.email))}</span></div><p class="sub">${t().sealedHint}</p>
 <div><button class="ghost" id="rv">${t().reveal}</button></div><p class="err" id="rverr" role="alert"></p><button id="nxt">${t().again}</button>`;
 S.sealed();setTimeout(S.mail,1100);
 $('#rv').onclick=async()=>{$('#rv').disabled=true;
  try{const r=await fetch('/api/oracle/reveal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:res.id})}),j=await r.json();if(!r.ok||!j.ok)throw 0;clearTimeout(timer);showAnswer({...res,answer:j.answer,sealed:false},true)}
  catch{$('#rv').disabled=false;$('#rverr').textContent=t().revealErr;S.fail()}};
 $('#nxt').onclick=start;timer=setTimeout(start,45000);
}
async function showAnswer(res,revealed){
 app.innerHTML=`${crystal()}<h2>${t().spoke}</h2>
 <div class="chips"><span class="chip">${t().state}: <span class="mono">|${res.state}⟩</span></span><span class="chip">${lang==='ar'?PN[res.state]:esc(res.personality)}</span><span class="chip">${lang==='ar'?(EN[res.energy]||esc(res.energy)):esc(res.energy)}</span></div>
 <div class="answer" id="an" dir="${isAr(res.answer)?'rtl':'ltr'}"></div><p class="sub" id="em"></p><p class="sub">${t().thanks}</p><button id="nxt">${t().again}</button>`;
 $('.gem').dataset.s=res.state;$('.gem').classList.add('pulse');S.answer(res.state);
 $('#nxt').onclick=start;timer=setTimeout(start,60000);
 const an=$('#an');for(let i=1;i<=res.answer.length;i++){an.textContent=res.answer.slice(0,i);if(i%2===0)S.type();await sleep(34)}
 if(revealed||res.emailSent)$('#em').textContent=t().sent;
 else{$('#em').textContent=t().notSent;S.fail()}
 if(!revealed&&res.emailSent)setTimeout(S.mail,500);
 clearTimeout(timer);timer=setTimeout(start,30000);
}

let lastAt=null,poll;
function display(){clearInterval(poll);app.innerHTML=`${crystal('big')}<h2>${t().rem}</h2><p class="sub"><b id="cnt">0</b> ${t().asked}</p><div class="glass" style="text-align:center"><div class="sub">${t().latest}</div><div id="lq" class="stage" style="font-size:1.3rem" dir="auto"></div><div id="la" class="answer" style="font-size:1.6rem;min-height:0" dir="auto"></div></div>`;
 async function tick(){try{const [p,s]=await Promise.all([fetch('/api/oracle/public').then(r=>r.json()),fetch('/api/oracle/stats').then(r=>r.json())]);
  $('#cnt').textContent=s.totalConsultations||0;const d=p.display;
  if(d&&d.createdAt!==lastAt){if(lastAt){S.newQ();$('.gem').classList.add('pulse');setTimeout(()=>$('.gem').classList.remove('pulse'),1100)}lastAt=d.createdAt;$('.gem').dataset.s=d.state;$('#lq').textContent=d.question;$('#la').textContent=d.answer}}catch{}}
 tick();poll=setInterval(tick,3000)}

setLang(lang);view==='display'?display():start();
</script></body></html>
